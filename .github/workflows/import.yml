name: Import data from Wikidata

on:
  workflow_dispatch:
  # 毎月2日に取り込み直し、差分があればプルリクエストを作る
  schedule:
    - cron: "0 18 2 * *"
  pull_request:
    paths:
      - scripts/import-wikidata.mjs
      - scripts/import-summaries.mjs
      - .github/workflows/import.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/import-wikidata.mjs
      - run: node scripts/import-summaries.mjs
      - run: npm run check:data
      - uses: actions/upload-artifact@v4
        with:
          name: wikidata-import
          path: data/import
      # プルリクエスト上では、取り込み結果をそのブランチにコミットする
      - if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import
          git diff --cached --quiet || (git commit -m "Wikidataから周年データを取り込み" && git push)
      # 定期実行・手動実行のときだけ、結果をプルリクエストにする
      # （リポジトリ設定 Actions → General で「Allow GitHub Actions to create and approve pull requests」をオンにする必要あり）
      - if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/wikidata-import
          commit-message: Wikidataから周年データを更新
          title: Wikidataから周年データを更新
          body: 定期取り込みの結果です。件数や内容を確認してからマージしてください。
          add-paths: data/import
