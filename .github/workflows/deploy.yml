name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # 「今日の周年」や年別ページの範囲を最新に保つため毎月1日に再ビルド
  schedule:
    - cron: "0 18 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          NEXT_PUBLIC_RAKUTEN_AFF_ID: ${{ vars.RAKUTEN_AFF_ID }}
          NEXT_PUBLIC_REPORT_FORM_URL: ${{ vars.REPORT_FORM_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true

  deploy:
    # FTP情報が登録されている場合のみ main へのpush時にデプロイ
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
