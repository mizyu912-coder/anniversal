name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # 「今日の周年」や年別ページの範囲を最新に保つため毎月1日に再ビルド
  schedule:
    - cron: "0 18 1 * *"
  workflow_dispatch:

# デプロイが同時に2つ走らないようにする
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          NEXT_PUBLIC_RAKUTEN_AFF_ID: ${{ vars.RAKUTEN_AFF_ID }}
          NEXT_PUBLIC_REPORT_FORM_URL: ${{ vars.REPORT_FORM_URL }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      # 画面遷移の先読み用ファイル（約8,500個）はアップロードしない。
      # なくても通常のページ遷移になるだけで表示に影響はない
      # robots.txt・ads.txt（AdSense）・IndexNow のキーファイル（英数字32桁.txt）は残す
      - run: find out -regextype posix-extended -type f -name '*.txt' ! -path 'out/robots.txt' ! -path 'out/ads.txt' ! -regex 'out/[0-9a-f]{32}\.txt' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true

  deploy:
    # FTP情報が登録されている場合のみ main へのpush時にデプロイ
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy
          path: repo
      # サイト全体をzip 1個で送り、サーバー上で展開する（1ファイルずつ送ると数時間かかるため）
      - run: bash repo/scripts/deploy/deploy.sh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
      # Bing などに更新を通知（失敗してもデプロイは成功扱い）
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            public
          path: src
      - run: cd src && node scripts/indexnow.mjs ../out/sitemap.xml || true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
